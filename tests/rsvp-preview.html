<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Season RSVP preview</title><link rel="stylesheet" href="/styles.css">
<style>body{padding:20px;margin:0}main{max-width:760px;margin:auto}nav{display:flex;gap:12px;margin:16px 0}</style></head>
<body><main><p>Sample season RSVP — all responses stay in this preview</p>
<nav><a href="#/gametracker/seasons/winter">Season games</a><a href="#/gametracker/rsvp/demo">Family RSVP</a></nav>
<div id="preview-view"></div><p id="notice" role="status"></p></main>
<script src="/js/gametracker/gt-core.js"></script><script src="/js/gametracker/gt-shell.js"></script>
<script src="/js/gametracker/gt-game.js"></script><script src="/js/gametracker/gt-seasons.js"></script>
<script src="/js/gametracker/gt-tournaments.js"></script><script src="/js/gametracker/gt-lineup.js"></script>
<script>
function appText(){ return 'Sample Team'; }
function showToast(text){ document.getElementById('notice').textContent = text; }
function gtLockBanner(){ return ''; }
function gtCanEdit(){ return false; }
function gtSeasonPlayerStats(){ return []; }
GT.loaded = { players:true, games:true, seasons:true, tournaments:true, avail:true, rsvp:true };
GT.rosters = [{id:'club',name:'Club roster'}];
GT.players = [
 {id:'a',roster_id:'club',first_name:'Alex',last_name:'Rivera',jersey_number:8},
 {id:'gavin',roster_id:'club',first_name:'Gavin',last_name:'Sample',jersey_number:4},
 {id:'other',roster_id:'club',first_name:'Outside',last_name:'Season',jersey_number:5},
 {id:'guest',roster_id:'__guests__',first_name:'Jordan',last_name:'Williams',jersey_number:12,is_guest:true}
];
GT.seasons = [{id:'winter',name:'Winter 7s',team_name:'Sample Team',base_roster_id:'club',roster:{a:true,guest:true}}];
GT.games = [{id:'demo',home_team:'Sample Team',away_team:'(re)United',f6ad_side:'home',season_id:'winter',roster_id:'club',status:'setup',game_type:'league',played_at:'2026-11-06',kickoff_time:'19:00'}];
GT.avail = GT.players.map(function(p){return {game_id:'demo',player_id:p.id,available:p.id==='a'||p.id==='guest'};});
GT.rsvp = [{game_id:'demo',player_id:'gavin',hidden:true}];
var previewMine = [];
function gtMyRsvpPlayers(){return previewMine;}
function gtSetMyRsvpPlayers(ids){previewMine=ids;}
var firebase = {firestore:{FieldValue:{serverTimestamp:function(){return 0;}}}};
function tdb(){return {doc:function(id){return {set:function(data){
 var old=GT.rsvp.find(function(r){return r.game_id===data.game_id&&r.player_id===data.player_id;});
 if(old) Object.assign(old,data); else GT.rsvp.push(data);
 gtRerender(); showToast('Sample response saved.'); return Promise.resolve();
}};}};}
function gtRerender(){
 var view=document.getElementById('preview-view');
 if(location.hash.indexOf('/rsvp/')>=0) gtRenderRsvp(view,'demo'); else gtRenderSeasonEntity(view,'winter');
}
window.addEventListener('hashchange',gtRerender); gtRerender();
</script></body></html>
