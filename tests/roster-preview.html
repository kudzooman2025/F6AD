<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roster preview</title><link rel="stylesheet" href="/styles.css">
<style>body{padding:20px;margin:0}main{max-width:720px;margin:auto}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}textarea{width:100%;min-height:160px}</style></head>
<body><main><p>Synthetic roster preview — no live team data</p>
<nav><button onclick="previewRoster('g')">League game</button><button onclick="previewRoster('s')">Season</button><button onclick="previewRoster('t')">Tournament</button></nav>
<div id="preview-view"></div><p id="notice" role="status"></p><label for="paste">Paste copied roster here</label><textarea id="paste"></textarea><div id="modal"></div></main>
<script src="/js/gametracker/gt-core.js"></script>
<script src="/js/gametracker/gt-tournaments.js"></script>
<script src="/js/gametracker/gt-seasons.js"></script>
<script src="/js/gametracker/gt-review.js"></script>
<script src="/js/gametracker/gt-lineup.js"></script>
<script>
function appText(){ return 'Sample Team'; }
function showToast(text){ document.getElementById('notice').textContent = text; }
function gtOpenModal(html){ document.getElementById('modal').innerHTML = html; }
function gtCloseModal(){ document.getElementById('modal').innerHTML = ''; }
GT.loaded = { players:true, games:true, seasons:true, tournaments:true, avail:true, rsvp:true };
GT.players = [
  { id:'a', first_name:'Alex', last_name:'Rivera', jersey_number:8, position:'CM', parent_email:'private@example.test' },
  { id:'b', first_name:'Removed', last_name:'Player', jersey_number:4 },
  { id:'g', first_name:'Jordan', last_name:'Williams', jersey_number:12, is_guest:true }
];
GT.games = [{ id:'demo', home_team:'Sample Team', away_team:'Rivals', f6ad_side:'home', game_type:'league', season_id:'demo', played_at:'2026-11-07', kickoff_time:'14:00' }];
GT.avail = ['a','b','g'].map(function(pid){ return { game_id:'demo', player_id:pid, available:true }; });
GT.rsvp = [{ game_id:'demo', player_id:'b', hidden:true }];
GT.seasons = [{ id:'demo', name:'Fall League', team_name:'Sample Team', roster:{ a:true, g:true } }];
GT.tournaments = [{ id:'demo', name:'Autumn Cup', team_name:'Sample Team', lineup:{ a:{available:true}, b:{available:false}, g:{available:true} } }];
function previewRoster(kind){ gtRenderLineup(document.getElementById('preview-view'),kind,'demo'); }
previewRoster('g');
</script></body></html>
