name: Admin password reset

on:
  workflow_dispatch:
    inputs:
      team:
        description: 'Which team'
        required: true
        default: 'F6AD'
        type: choice
        options:
          - F6AD
          - Montco
      email:
        description: 'Account email'
        required: true
        default: 'kudzooman@gmail.com'
      new_password:
        description: 'New password (min 6 characters)'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Admin SDK
        run: npm install firebase-admin@12
      - name: Set the password
        env:
          GCP_SA_KEY: ${{ inputs.team == 'Montco' && secrets.GCP_SA_KEY_MONTCO || secrets.GCP_SA_KEY }}
          TARGET_EMAIL: ${{ inputs.email }}
          NEW_PW: ${{ inputs.new_password }}
        run: |
          echo "Target team: ${{ inputs.team }}"
          node scripts/admin-reset.js
