name: Deploy Montco to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Is Montco configured yet?
        id: gate
        env:
          KEY: ${{ secrets.GCP_SA_KEY_MONTCO }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_SA_KEY_MONTCO is not set — skipping the Montco deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
      - name: Build with the FC Montco config
        if: steps.gate.outputs.configured == 'true'
        run: |
          cp js/00-config.montco.js js/00-config.js
          rm -f js/00-config.montco.js
          echo "Deploying as: $(grep -m1 teamName js/00-config.js)"
      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore --project f6ad-montco
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_MONTCO }}
          PROJECT_ID: f6ad-montco
