name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase (service-account auth)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore --project f6ad-2913b
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: f6ad-2913b
